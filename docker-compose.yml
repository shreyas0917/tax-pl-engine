name: taxpl

services:
  postgres:
    image: postgres:16-alpine
    container_name: taxpl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxpl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxpl_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-taxpl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taxpl-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional S3-compatible storage. Start with: docker compose --profile s3 up -d
  minio:
    image: minio/minio:latest
    container_name: taxpl-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taxpl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-taxpl_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taxpl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-taxpl_dev_password}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/taxpl-raw;
      mc mb --ignore-existing local/taxpl-reports;
      exit 0;
      "

  # Optional event bus for Phase 5. Start with: docker compose --profile events up -d
  kafka:
    image: apache/kafka:3.8.0
    container_name: taxpl-kafka
    profiles: ["events"]
    ports:
      - "9092:9092"

  # --- Whole app in containers: docker compose --profile app up -d --build (make app) ---
  migrate:
    build: ./backend
    profiles: ["app"]
    command: ["goose", "-dir", "/app/db/migrations", "postgres", "postgres://${POSTGRES_USER:-taxpl}:${POSTGRES_PASSWORD:-taxpl_dev_password}@postgres:5432/${POSTGRES_DB:-taxpl}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    container_name: taxpl-api
    profiles: ["app"]
    command: ["api"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-taxpl}:${POSTGRES_PASSWORD:-taxpl_dev_password}@postgres:5432/${POSTGRES_DB:-taxpl}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081}
      BLOB_DRIVER: local
      BLOB_LOCAL_DIR: /app/data/blobs
      RAW_FILE_TTL_HOURS: ${RAW_FILE_TTL_HOURS:-24}
    volumes:
      - blobdata:/app/data/blobs
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: taxpl-worker
    profiles: ["app"]
    command: ["worker"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-taxpl}:${POSTGRES_PASSWORD:-taxpl_dev_password}@postgres:5432/${POSTGRES_DB:-taxpl}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      BLOB_DRIVER: local
      BLOB_LOCAL_DIR: /app/data/blobs
      RAW_FILE_TTL_HOURS: ${RAW_FILE_TTL_HOURS:-24}
      WORKER_COUNT: ${WORKER_COUNT:-4}
    volumes:
      - blobdata:/app/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: taxpl-web
    profiles: ["app"]
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  blobdata:
